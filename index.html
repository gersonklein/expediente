    const c = ch.crows[k], d = Math.hypot(c.x - player.x, c.z - player.z);

      for (const o of ch.crows) if (!o.fly && Math.hypot(o.x - c.x, o.z - c.z) < 6) { const a = Math.atan2(o.x - player.x, o.z - player.z) + R(-.6, .6); Object.assign(o, { fly: true, vx: Math.sin(a) * R(3, 4.5), vz: Math.cos(a) * R(3, 4.5), vy: R(1.6, 2.4) }); o.g.rotation.y = a; }

// física dos balões na água (2D no plano da superfície): quem passa empurra, balão bate em balão (choque elástico

function updateBalloons(dt, t) {
  const agents = [player, ...entities]; if (cat) agents.push(cat);
  const h = Math.min(dt, 1 / 30), R2 = BALLOON_R * 2;
  for (const ch of chunks.values()) {
    const bs = ch.balloons; if (!bs.length) continue;
    if (Math.hypot(bs[0].x - player.x, bs[0].z - player.z) > 30) continue;
    for (const b of bs) {
      for (const a of agents) { // empurrão: mola macia em volta do corpo de quem passa
        const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz), reach = BALLOON_R + .35;
        if (d < reach && d > 1e-4) { const k = (reach - d) * 40 * h; b.vx += dx / d * k; b.vz += dz / d * k; }
      }
      const drag = Math.exp(-h * 1.4); b.vx *= drag; b.vz *= drag;
      b.vx += Math.sin(t * .3 + b.ph) * .02 * h; b.vz += Math.cos(t * .27 + b.ph * 1.3) * .02 * h; // correnteza fraca
    }
    for (let i = 0; i < bs.length; i++) for (let j = i + 1; j < bs.length; j++) { // colisões entre balões
      const a = bs[i], b = bs[j], dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz);
      if (d >= R2 || d < 1e-5) continue;

      const vn = (b.vx - a.vx) * nx + (b.vz - a.vz) * nz;
      if (vn < 0) { const imp = -vn * .8; a.vx -= nx * imp; a.vz -= nz * imp; b.vx += nx * imp; b.vz += nz * imp; } // restituição .6
    }

      if (b.x < x0) { b.x = x0; b.vx = Math.abs(b.vx) * .5; } else if (b.x > x1) { b.x = x1; b.vx = -Math.abs(b.vx) * .5; }

    }

}

// --- o gato: raro — só aparece em CAT_CHANCE dos níveis, longe, e se ficar para trás quase nunca volta;

const CAT_CHANCE = .3, CAT_BACK = .2, CAT_SAFE = 6; // CAT_SAFE: nenhuma entidade entra nesse raio em volta do gato

    const cx = (i + .5) * C, cz = (j + .5) * C;
    if (!isFree(cx, cz, .25) || !bfsPath(i, j, pi, pj)) continue;
    x = cx; z = cz; break;
  }
  Object.assign(cat, { x, z, prev: null, face: Math.random() * 7, ph: 0, sit: 0, met: false, meowT: 4 + Math.random() * 8 });

}

  const C = L.C, i = Math.floor(cat.x / C), j = Math.floor(cat.z / C), nb = cellNbrs(i, j);
  const opts = nb.length > 1 && cat.prev ? nb.filter(([a, b]) => a !== cat.prev[0] || b !== cat.prev[1]) : nb; // evita dar meia-volta
  const [a, b] = opts.length ? opts[Math.floor(Math.random() * opts.length)] : [i, j];
  cat.prev = [i, j]; cat.tx = (a + .5 + (Math.random() - .5) * .5) * C; cat.tz = (b + .5 + (Math.random() - .5) * .5) * C; cat.walkT = 0;
}
function meow() { sfx('miado'); }
function updateCat(dt, t) {
  if (!cat || !cat.on) return;
  const d = Math.hypot(cat.x - player.x, cat.z - player.z);
  if (d > 50) { placeCat(CAT_BACK); return; }
  let moving = false;
  if (cat.sit > 0) { cat.sit -= dt; if (cat.sit <= 0) catNext(); }
  else {
    const mx = cat.tx - cat.x, mz = cat.tz - cat.z, ml = Math.hypot(mx, mz);
    cat.walkT += dt;
    if (ml < .15 || cat.walkT > 7) { if (Math.random() < .3) cat.sit = 2 + Math.random() * 5; else catNext(); }
    else {
      const s = Math.min(ml, .9 * dt); cat.x += mx / ml * s; cat.z += mz / ml * s; moving = true;
      let df = Math.atan2(mx, mz) - cat.face; df = Math.atan2(Math.sin(df), Math.cos(df)); cat.face += df * Math.min(1, dt * 6);

  c.body.rotation.x += ((sitting ? -.45 : 0) - c.body.rotation.x) * k;
  c.body.position.y = .22 + (moving ? Math.abs(Math.sin(cat.ph)) * .012 : 0);
  c.head.rotation.x += ((sitting ? .45 : 0) - c.head.rotation.x) * k;
  c.head.rotation.y = moving ? 0 : Math.sin(t * .6 + cat.face) * .6;
  c.tail.rotation.y = Math.sin(t * (moving ? 3 : 1.4)) * .4;
  c.root.position.set(cat.x, 0, cat.z); c.root.rotation.y = cat.face;
  if (d < 3 && !cat.met) { cat.met = true; player.san = 100; showMsg('um gato — a sanidade volta'); meow(); flash = .2; }
  cat.meowT -= dt; if (cat.meowT <= 0) { cat.meowT = 8 + Math.random() * 14; if (d < 10) meow(); }
  if (d < CAT_SAFE && !player.dead) player.san = Math.min(100, player.san + dt * (d < 2 ? 8 : 4)); // ficar perto acalma
  cat.petT = Math.max(0, (cat.petT || 0) - dt);

}

/* paletteFromImage pega as cores que aparecem na imagem (ignora as raras, até MAXPAL); applyPalette ordena do escuro para o claro

  const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height).data, count = new Map();
  for (let k = 0; k < d.length; k += 4) { if (d[k + 3] < 128) continue; const h = (d[k] << 16) | (d[k + 1] << 8) | d[k + 2]; count.set(h, (count.get(h) || 0) + 1); }

  return [...count].filter(([, n]) => n >= min).sort((a, b) => b[1] - a[1]).slice(0, MAXPAL)
    .map(([h]) => '#' + h.toString(16).padStart(6, '0'));
}
function applyPalette(hexes, quiet = false) {
  if (hexes.length < 2) { showMsg('paleta vazia'); return; }
  const cols = hexes.map(h => new THREE.Color(h)).sort((a, b) => lumOf(a) - lumOf(b));
  NPAL = cols.length; cols.forEach((c, i) => PAL[i].copy(c)); ditherMat.uniforms.uN.value = NPAL;
  fixLitMat.color.copy(lampCol()); // a luminária acompanha a cor mais clara da paleta nova
  doorTopMat.color.copy(doorTopCol());
  T.paleta = cols.map(c => '#' + c.getHexString());   // só a cena: a UI Zenith mantém as cores do kit
}
