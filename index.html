function h3(i, j, k) { let h = Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(k, 1442695041) + Math.imul(SEED, 97) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967295; }

// Bayer 8x8 (o mesmo da referência ZX Spectrum)

    uPal: { value: PAL }, uN: { value: NPAL },
    uMode: { value: qs.get('modo') === 'proximas' ? 1 : 0 }, uContrast: { value: T.pos.contraste }, uBright: { value: T.pos.exposicao }, uWhite: { value: T.pos.branco || 0 },

function chunkKind(ci, cj) {

    for (const [a, b] of cellNbrs(i, j)) {

/* =====================================================================

const Z = { cream: '#ece8d4', grey: '#6e6d69', greyL: '#a9a69c', ink: '#242423' };

  face: ['#####', '#.#.#', '#####', '#####', '#####'], almond_water: ['.###.', '..#..', '.###.', '.#.#.', '.###.'],
  flashlight: ['.....', '...##', '#####', '#####', '...##'], battery: ['.....', '####.', '##.##', '####.', '.....'],
  note: ['####.', '#####', '#...#', '#####', '#..##'], map: ['#####', '#..##', '##.##', '##..#', '#####'],
  door: ['.###.', '#####', '###.#', '#####', '#####'], entity: ['.###.', '#.#.#', '#####', '#####', '#.#.#'],
  sanity: ['#####', '#....', '#.###', '#...#', '#####'], breath: ['.#.#.', '##.##', '##.##', '##.##', '.#.#.'],
  signal: ['....#', '...##', '..###', '.####', '#####'], gear: ['#.#.#', '.###.', '##.##', '.###.', '#.#.#'],
  eye: ['.###.', '#...#', '#.#.#', '#...#', '.###.'],
  coffee: ['.#.#.', '#.#..', '####.', '#####', '.##..'], cat: ['#...#', '#####', '#.#.#', '#####', '.###.'],

// d = letreiro largo ("PORTAL"), m = rótulos mono ("BOOT SEQUENCE INITIATED", "01:25:43")
const FONT = { d: { fam: '"Krona One", "Arial Black", sans-serif', ls: .02 }, m: { fam: '"Share Tech Mono", Consolas, monospace', ls: .08 } };
function setFont(x, k, size) { const f = FONT[k]; x.font = `${size}px ${f.fam}`; if ('letterSpacing' in x) x.letterSpacing = `${(f.ls * size).toFixed(2)}px`; }

function rrect(x, X, Y, W, H, r) {

  lu.uFocusDepth.value += (-fv.z - lu.uFocusDepth.value) * fk;
  lu.uAmount.value += ((title ? 1.25 : 1 + sanK * .25) - lu.uAmount.value) * fk;
  lu.uNear.value = camera.near; lu.uFar.value = camera.far;
  const kz = clamp(Math.sqrt(24 / D), .7, 1.4); lu.uR0.value = LENS.raio * kz; lu.uR1.value = LENS.queda * kz; lu.uDepthK.value = LENS.profundidade * kz;
  scene.fog.near = D + 4; scene.fog.far = D + 22;

  CUT.uPlayer.value.set(title ? -9999 : player.x, 0, player.z);
  selfLight.position.set(player.x, 2.1, player.z); selfLight.intensity = title ? 0 : 7.5;
  spot.position.set(player.x + aimX * .3, 1.25, player.z + aimZ * .3); spot.target.position.set(player.x + aimX * 6, .2, player.z + aimZ * 6);
  if (title || player.dead) spot.intensity = 0;
  exitLight.intensity = 22 + Math.sin(t * 3) * 6;
  sun.position.copy(camTarget).addScaledVector(SUN_DIR, 45); sun.target.position.copy(camTarget);

  flash *= Math.exp(-dt * 5); glitch = Math.max(0, glitch - dt * 1.4);
  if (game === 'play' && player.san < 30 && h3(Math.floor(t * 3), 2, 31) < .08) glitch = Math.max(glitch, .5);
  ditherMat.uniforms.uGrain.value = T.pos.grao + (game === 'play' ? sanK * sanK * .12 : 0);
  crtMat.uniforms.uFlicker.value = T.pos.flicker + (game === 'play' ? sanK * .08 : 0);
  crtMat.uniforms.uGlitch.value = Math.min(1.5, glitch);
  crtMat.uniforms.uFade.value = game === 'trans' ? 1 - Math.abs(fadeT - 1) : game === 'end' ? clamp((endT - .5) * .5, 0, .55) : 0;

  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, UI.width, UI.height); g.setTransform(UIS, 0, 0, UIS, 0, 0);
  if (title) drawTitle(t);
  else if (game === 'map') drawMap();
  else { drawHUD(dt, t); if (game === 'note') drawNote(); if (game === 'end') drawEnd(dt, t); }
  uiTex.needsUpdate = true;

  ditherMat.uniforms.uTime.value = crtMat.uniforms.uTime.value = t; ditherMat.uniforms.uFlash.value = flash;
  renderer.setRenderTarget(sceneRT); renderer.render(scene, camera);
  renderer.setRenderTarget(ditherRT); renderer.render(postA, ortho);
  renderer.setRenderTarget(lensRT); renderer.render(postL, ortho);
  renderer.setRenderTarget(null); renderer.render(postB, ortho);
}
