/* =====================================================================
   7. UI ZENITH  (skills da pasta UI: ref-style-extract + pixel-icons; tokens em UI/Output/_style/tokens.json)
   Base visual: UI/Ref — pôster retrofuturista minimalista: creme sobre quase-preto, letreiro largo e quadrado
   (Krona One), rótulos mono (Share Tech Mono), pílulas de contorno fino divididas em células, ladrilhos
   xadrez, divisas >>>>>> e triângulos concêntricos. Sem painéis e sem texto supérfluo: ícones 5x5
   (UI/Ref_icons) no lugar de rótulos sempre que possível. Os itens a buscar no mundo também são ícones.
   Canvas de 1024 px com coordenadas lógicas de 512.
   ===================================================================== */
const Z = { cream: '#ece8d4', grey: '#6e6d69', greyL: '#a9a69c', ink: '#242423' };
const SHADOW = 'rgba(28,28,27,.7)', DIM = 'rgba(169,166,156,.3)';
const UIS = UI.width / 512;
// ícones 5x5 da skill pixel-icons (UI/Output/zenith/icons/icons.json, formato de UI/Ref_icons)
const ICONS = {
  heart: ['##.##', '#####', '#####', '.###.', '..#..'], close: ['##.##', '#####', '.###.', '#####', '##.##'],
  face: ['#####', '#.#.#', '#####', '#####', '#####'], almond_water: ['.###.', '..#..', '.###.', '.#.#.', '.###.'],
  flashlight: ['.....', '...##', '#####', '#####', '...##'], battery: ['.....', '####.', '##.##', '####.', '.....'],
  note: ['####.', '#####', '#...#', '#####', '#..##'], map: ['#####', '#..##', '##.##', '##..#', '#####'],
  door: ['.###.', '#####', '###.#', '#####', '#####'], entity: ['.###.', '#.#.#', '#####', '#####', '#.#.#'],
  sanity: ['#####', '#....', '#.###', '#...#', '#####'], breath: ['.#.#.', '##.##', '##.##', '##.##', '.#.#.'],
  signal: ['....#', '...##', '..###', '.####', '#####'], gear: ['#.#.#', '.###.', '##.##', '.###.', '#.#.#'],
  eye: ['.###.', '#...#', '#.#.#', '#...#', '.###.'],
  coffee: ['.#.#.', '#.#..', '####.', '#####', '.##..'], cat: ['#...#', '#####', '#.#.#', '#####', '.###.'],
  phone: ['#####', '#.#.#', '..#..', '.###.', '.###.'],

// d = letreiro largo ("PORTAL"), m = rótulos mono ("BOOT SEQUENCE INITIATED", "01:25:43")
const FONT = { d: { fam: '"Krona One", "Arial Black", sans-serif', ls: .02 }, m: { fam: '"Share Tech Mono", Consolas, monospace', ls: .08 } };
function setFont(x, k, size) { const f = FONT[k]; x.font = `${size}px ${f.fam}`; if ('letterSpacing' in x) x.letterSpacing = `${(f.ls * size).toFixed(2)}px`; }
const MC = document.createElement('canvas').getContext('2d');
const measure = (k, size, s) => { setFont(MC, k, size); return MC.measureText(s).width; };

// ---------- primitivas ----------
function txt(x, s, X, Y, k, size, col = Z.cream, { align = 'left', max = 0, sh = true } = {}) {
  setFont(x, k, size); x.textBaseline = 'alphabetic'; x.textAlign = 'left';
  const tw = x.measureText(s).width || 1, sx = max && tw > max ? max / tw : 1, W = tw * sx;
  const x0 = align === 'center' ? X - W / 2 : align === 'right' ? X - W : X;
  const pass = (o, c) => { x.save(); x.translate(x0 + o, Y + o); x.scale(sx, 1); x.fillStyle = c; x.fillText(s, 0, 0); x.restore(); };

}
function wrapText(s, maxW, k, size) {
  const out = []; let line = '';

  if (line) out.push(line); return out;
}
function rule(x, X, Y, W, col = Z.cream) { x.fillStyle = SHADOW; x.fillRect(X + .6, Y + .6, W, .8); x.fillStyle = col; x.fillRect(X, Y, W, .8); }
function icon(x, name, X, Y, cell, col = Z.cream, sh = true) {
  const draw = (o, c) => { x.fillStyle = c; ICONS[name].forEach((row, r) => { for (let q = 0; q < 5; q++) if (row[q] === '#') x.fillRect(X + o + q * cell, Y + o + r * cell, cell + .05, cell + .05); }); };
  if (sh) draw(cell * .4, SHADOW); draw(0, col);
}
function rrect(x, X, Y, W, H, r) {

}
// pílula de contorno fino; cells = posições x das divisórias
function pill(x, X, Y, W, H, cells = [], col = Z.cream) {
  x.lineWidth = .8;
  rrect(x, X + .6, Y + .6, W, H, H * .32); x.strokeStyle = SHADOW; x.stroke();
  rrect(x, X, Y, W, H, H * .32); x.strokeStyle = col; x.stroke();

// ladrilho xadrez da Ref
function checker(x, X, Y, cols, rows, s, col = Z.cream) { x.fillStyle = col; for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if ((r + c) % 2 === 0) x.fillRect(X + c * s, Y + r * s, s, s); }

// divisas >>>>>> (medidor do sinal)
function chevrons(x, X, Y, n, lit, col = Z.cream) {

const keyW = (label, h) => label.length === 1 ? h : Math.max(h, measure('m', h * .62, label) + h * .7);
function keycap(x, label, X, Y, h = 14) {

function meter(X, Y, W, v, low) {

function dimScreen(a) { g.fillStyle = `rgba(36,36,35,${a})`; g.fillRect(0, 0, 512, 512); }

// ---------- itens do mundo: ícones 5x5 sobre a posição do item ----------

function worldIcon(it, y, name, col, dt, lanterna = false) {
